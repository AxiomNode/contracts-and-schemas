openapi: 3.1.0
info:
  title: Internal AI Engine API
  version: 1.2.0
  description: >-
    Contrato interno de generacion de contenido, ingesta RAG y catalogos.
    PARTIAL: the routes added after 2026-11-12 (marked x-source: code-inventory) only
    list path, method and summary, taken from the FastAPI decorators in
    ai-engine src/ai_engine/api/app.py and src/ai_engine/observability/api.py on
    origin/main; their request and response schemas are intentionally not documented
    here. The /internal/* routes (include_in_schema=False in the app) are not listed.
    Because the API (7001) and the stats app (7000) are two FastAPI apps, /health
    exists on both; only the API one is described below.
servers:
  - url: http://ai-engine-api:7001
    description: AI Engine API (generacion e ingesta)
  - url: http://ai-engine-stats:7000
    description: AI Engine Stats (observabilidad)
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /generate/quiz:
    post:
      summary: Genera quiz estructurado
      parameters:
        - in: query
          name: category_id
          schema:
            type: string
        - in: query
          name: category_name
          schema:
            type: string
        - in: query
          name: difficulty_percentage
          schema:
            type: integer
        - in: query
          name: num_questions
          schema:
            type: integer
      responses:
        "200":
          description: Generacion exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedQuizEnvelope"
        "500":
          description: Error de inferencia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /generate/word-pass:
    post:
      summary: Genera wordpass estructurado
      parameters:
        - in: query
          name: category_id
          schema:
            type: string
        - in: query
          name: category_name
          schema:
            type: string
        - in: query
          name: difficulty_percentage
          schema:
            type: integer
        - in: query
          name: item_count
          schema:
            type: integer
        - in: query
          name: num_questions
          schema:
            type: integer
      responses:
        "200":
          description: Generacion exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedWordPassEnvelope"
        "500":
          description: Error de inferencia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ingest/quiz:
    post:
      summary: Ingesta de documentos RAG para quiz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                documents:
                  type: array
                  items:
                    type: object
                    required: [content]
                    properties:
                      content:
                        type: string
                      doc_id:
                        type: string
                      metadata:
                        type: object
      responses:
        "200":
          description: Ingesta exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
  /ingest/word-pass:
    post:
      summary: Ingesta de documentos RAG para wordpass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/paths/~1ingest~1quiz/post/requestBody/content/application~1json/schema"
      responses:
        "200":
          description: Ingesta exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
  /catalogs:
    get:
      summary: Catalogo de categorias disponibles
      responses:
        "200":
          description: Catalogos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogsResponse"
  /ready:
    get:
      summary: Readiness based on async bootstrap completion
      x-source: code-inventory
      responses:
        "200":
          description: OK
  /catalogs/languages:
    get:
      summary: Canonical language catalog
      x-source: code-inventory
      responses:
        "200":
          description: OK
  /catalogs/categories:
    get:
      summary: Canonical category catalog
      x-source: code-inventory
      responses:
        "200":
          description: OK
  /generate:
    post:
      summary: Generate game content (generic; optional X-Game-Language header)
      x-source: code-inventory
      responses:
        "200":
          description: OK
  /generate/sdk:
    post:
      summary: Generate game content through the SDK response model
      x-source: code-inventory
      responses:
        "200":
          description: OK
  /generate/true-false:
    post:
      summary: Generate a true-false game (no service, BFF or app consumes it)
      x-source: code-inventory
      responses:
        "200":
          description: OK
  /ingest:
    post:
      summary: Ingest documents into the RAG store (source query parameter)
      x-source: code-inventory
      responses:
        "200":
          description: OK
  /ingest/true-false:
    post:
      summary: Ingest RAG documents for true-false
      x-source: code-inventory
      responses:
        "200":
          description: OK
  /diagnostics/rag/stats:
    get:
      summary: RAG vector store health and coverage metrics
      x-source: code-inventory
      responses:
        "200":
          description: OK
  /diagnostics/tests/run:
    post:
      summary: Start a hallucination and quality diagnostic test run
      x-source: code-inventory
      responses:
        "200":
          description: OK
  /diagnostics/tests/status:
    get:
      summary: Current diagnostic test run status and results
      x-source: code-inventory
      responses:
        "200":
          description: OK
  /stats:
    get:
      summary: Aggregate statistics over recorded events
      x-source: code-inventory
      servers:
        - url: http://ai-engine-stats:7000
          description: AI Engine Stats (observabilidad)
      responses:
        "200":
          description: OK
  /events:
    post:
      summary: Ingest one observability event emitted by another service
      x-source: code-inventory
      servers:
        - url: http://ai-engine-stats:7000
          description: AI Engine Stats (observabilidad)
      responses:
        "200":
          description: OK
  /stats/history:
    get:
      summary: Recorded event history
      x-source: code-inventory
      servers:
        - url: http://ai-engine-stats:7000
          description: AI Engine Stats (observabilidad)
      responses:
        "200":
          description: OK
  /stats/reset:
    post:
      summary: Clear all recorded events
      x-source: code-inventory
      servers:
        - url: http://ai-engine-stats:7000
          description: AI Engine Stats (observabilidad)
      responses:
        "200":
          description: OK
  /cache/stats:
    get:
      summary: Generation cache counters (proxied from the API app)
      x-source: code-inventory
      servers:
        - url: http://ai-engine-stats:7000
          description: AI Engine Stats (observabilidad)
      responses:
        "200":
          description: OK
  /cache/reset:
    post:
      summary: Reset the generation cache (namespace and all_namespaces query parameters)
      x-source: code-inventory
      servers:
        - url: http://ai-engine-stats:7000
          description: AI Engine Stats (observabilidad)
      responses:
        "200":
          description: OK
  /metrics:
    get:
      summary: Prometheus scrape-compatible metrics text
      x-source: code-inventory
      servers:
        - url: http://ai-engine-stats:7000
          description: AI Engine Stats (observabilidad)
      responses:
        "200":
          description: OK

components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
        total_events:
          type: integer
        correlation_id:
          type: string
        distribution_version:
          type: string
        startup:
          type: object
          additionalProperties: true
        dependencies:
          type: object
          additionalProperties: true
      additionalProperties: true
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
        error:
          type: string
      additionalProperties: true
    IngestResponse:
      type: object
      required: [ingested]
      properties:
        ingested:
          type: integer
      additionalProperties: true
    GeneratedQuizEnvelope:
      type: object
      required: [game_type, game]
      properties:
        game_type:
          type: string
          const: quiz
        game:
          $ref: "#/components/schemas/QuizGame"
        metadata:
          type: object
          additionalProperties: true
      additionalProperties: true
    GeneratedWordPassEnvelope:
      type: object
      required: [game_type, game]
      properties:
        game_type:
          type: string
          const: word-pass
        game:
          $ref: "#/components/schemas/WordPassGame"
        metadata:
          type: object
          additionalProperties: true
      additionalProperties: true
    QuizGame:
      type: object
      properties:
        game_type:
          type: string
        title:
          type: string
        difficulty_percentage:
          type: integer
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuizQuestion"
      additionalProperties: true
    QuizQuestion:
      type: object
      properties:
        id:
          type: string
        question:
          type: string
        answers:
          type: array
          items:
            type: string
        correctIndex:
          type: integer
        options:
          deprecated: true
          type: array
          items:
            type: string
        correct_answer:
          deprecated: true
          type: string
        correct_index:
          deprecated: true
          type: integer
        explanation:
          type: string
      additionalProperties: true
    WordPassGame:
      type: object
      properties:
        game_type:
          type: string
        title:
          type: string
        difficulty_percentage:
          type: integer
        words:
          type: array
          items:
            $ref: "#/components/schemas/WordPassEntry"
      additionalProperties: true
    WordPassEntry:
      type: object
      properties:
        id:
          type: string
        definition:
          type: string
        word:
          type: string
        letter:
          deprecated: true
          type: string
        clue:
          deprecated: true
          type: string
        hint:
          deprecated: true
          type: string
        answer:
          deprecated: true
          type: string
        starts_with:
          deprecated: true
          type: boolean
      additionalProperties: true
    CatalogsResponse:
      type: object
      properties:
        distribution_version:
          type: string
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
      additionalProperties: true
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      additionalProperties: true
